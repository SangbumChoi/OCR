variants:
  - id: siglip
    hypothesis: "Pairwise sigmoid alignment improves small-batch document pretraining and avoids softmax normalization across unrelated documents."

  - id: softmax
    hypothesis: "Symmetric multi-positive InfoNCE remains stronger when each batch supplies enough informative document negatives."
    blueprint_patches:
      - {op: replace, path: /student/task_heads/contrastive_objective, value: softmax}

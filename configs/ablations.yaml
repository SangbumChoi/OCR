# Ablation registry (see docs/report/ablation_plan.md). Declarative so each ablation is
# one fine-tuning config + the eval axis it targets. Train variants differ ONLY in `factor`.

# Fine-tuning base: lfm2_5-vl-1.6b — its hybrid-conv backbone trains ~10x faster on a T4 than
# qwen3_5-0.8b (whose full-attention prefill runs ~0.05 it/s; see notebooks/latency_profile.ipynb).
# qwen3_5-0.8b remains selectable (run_ablation --models / notebook MODEL) but LFM is the default base.
target_models: [lfm2_5-vl-1.6b]
base_task: document-generation (image -> structured text); per-ablation augmentation from
           data/probes/realistic_cases (configs/synth_data.yaml)

# ---------------------------------------------------------------------------------------------
# CONTROL FACTOR (held fixed across every arm so a delta is attributable to the factor alone):
#   - same number of TRAINING IMAGES / ITERATIONS (max_steps) and same optimiser/seed;
#   - same EVAL suite scored after each arm.
# Most arms keep the *image set fixed* and change only what GT is read from each image (reasoning =
# capturing more of the per-image information vs. missing it). A4 instead keeps the TOTAL SAMPLE
# COUNT fixed and varies the language mix (equal totals -> synergy/interference is comparable).
control:
  fixed: [n_images, max_steps, optimizer, seed, eval_suite]
  notes: "reasoning/spotting arms reuse the SAME images (vary GT richness); A4 fixes total samples."

# Every arm is scored on the WHOLE suite (not just its target axis) to measure CROSS-CAPABILITY
# transfer — e.g. does spotting also help CER/KIE/reasoning? does multilingual hurt EN?
eval_suite: [capability, spatial, realistic]   # cap_*, L2-L7 signals, realistic per-axis (CER/KIE/reason)

# Baseline gaps the ablations must close.
#   qwen3_5-0.8b: MEASURED on the original GPU eval (control-robust).
#   lfm2_5-vl-1.6b: PROVISIONAL — the default base moved to LFM, whose vision stack + tokenizer differ,
#     so the Qwen gap profile may be deprecated. Re-measure on LFM before interpreting the arms:
#       python scripts/run_ablation.py --arm baseline   # refreshes gaps.lfm2_5-vl-1.6b
gaps:
  lfm2_5-vl-1.6b: [L1_grounding, spot_iou]   # provisional (carried over from qwen; not yet re-measured on LFM)
  qwen3_5-0.8b: [L1_grounding, L4_box_tracking, H2_relational, rotation_180, latency]

ablations:
  # A0 is the PREREQUISITE: synthetic data only LOOKS infinite — the context x layout product is
  # finite and closed (no LLM in the loop, on cost grounds), so a high-capacity model can MEMORISE the
  # templates instead of learning the task. Separate "the model UNDERSTANDS" from "it MEMORISED" by
  # training at increasing data scale on seed S and scoring BOTH the TRAIN split (memorization: climbs
  # to ~100%) and a HELD-OUT val/test split generated with a DIFFERENT seed (same distribution, unseen
  # content). The train-vs-held-out gap is the memorization signal; the held-out learning curve is the
  # understanding signal. Its result fixes the data scale ("how many images") used by A1-A7.
  - id: A0_generalization
    question: "Does the model UNDERSTAND or just MEMORISE the synthetic templates?"
    factor: "training data scale (count = #images) — a learning curve"
    protocol: "train on seed=7 x count in {50,200,800,3200}; eval held-out seed=999 (unseen content)"
    control: "same eval set; only train count changes; held-out NEVER overlaps train (different seed)"
    target_metrics: [heldout_score, train_minus_heldout_gap]
    decision: "pick the count where held-out keeps improving (understanding) and the gap stays small;
               if train->~1.0 while held-out plateaus, that scale is memorising -> back off / add diversity"
    hypothesis: "understanding -> held-out rises with scale, small gap; memorization -> big train/test gap"

  - id: A1_spotting
    question: "Does adding bbox (where) targets improve extraction + spatial grounding — and does it
               TRANSFER to the original CER/KIE/reasoning targets?"
    factor: "target = value + [x1,y1,x2,y2]  vs  value only"
    data_arm: {on: A1_spotting_on, off: A1_spotting_off}   # configs/synth_data.yaml overrides
    control: "SAME images & QA, same n_images/steps/optim (only the bbox target is added)"
    closes_gap: [L1_grounding, L4_box_tracking]
    target_metrics: [grounding_iou, cap_ground, spot_iou]
    transfer_metrics: [cap_text_cer, cap_kie, cap_integ_rel]   # did 'where' also help 'what'/'why'?
    hypothesis: "spotting is a vision+connector signal -> grounding up; test if it also lifts CER/KIE/reasoning"

  - id: A2_reasoning
    question: "Does CoT/rationale supervision help reasoning — i.e. capturing the per-image
               information diversity (sum/diff/next-action) instead of missing it?"
    factor: "SAME images; target = rationale -> answer  vs  answer only (richer GT read per image)"
    data_arm: {on: A2_reasoning_on, off: A2_reasoning_off}
    control: "SAME images & n_images/steps; only GT richness (rationale + harder tasks) changes"
    closes_gap: [H2_relational]
    target_metrics: [cap_integ_sum, cap_integ_rel, H_count, H_action]
    transfer_metrics: [cap_kie, cap_text_cer]                  # does reasoning supervision cost extraction?
    hypothesis: "rationale (LLM attn+mlp) -> relational/numeric/action reasoning up, extraction held"

  - id: A3_signal_vs_combined
    question: "Is it the structured signals (spot/reason) that help, or plain task combination?"
    factor: "{answer} | {+spot} | {+reason} | {+spot+reason}"
    data_arm: {answer: A3_answer_only, spot: A3_spot_only, reason: A3_reason_only,
               both: A3_spot_and_reason}
    control: "same data/steps"
    metrics: [composite, grounding_iou, cap_integ_rel]
    hypothesis: "spot & reason are complementary and beat plain combination"

  - id: A4_multilingual
    question: "At EQUAL total samples, which language PAIRS help each other and which interfere?"
    factor: "train mix: {en} {en+es} {en+ja} {ko+en} {en+zh} {all}"
    data_arm: {en: A4_en, en_es: A4_en_es, en_ja: A4_en_ja, ko_en: A4_ko_en,
               en_zh: A4_en_zh, all: A4_all}
    control: "EQUAL TOTAL SAMPLES across mixes (e.g. 1000/dir vs 500/dir x2) so synergy is comparable"
    target_metrics: [per_language_ned]
    transfer_metrics: [en_ned]   # does adding a 2nd language help or HURT EN? (synergy vs interference)
    analysis: "transfer(L1<-L2) = ned_L1(train L1+L2) - ned_L1(train L1); heatmap of synergistic vs interfering pairs"
    hypothesis: "related scripts transfer (en-es, ko-en); distant (en-ja) help less or interfere at fixed capacity"

  - id: A5_lora_placement
    question: "Which modules to LoRA-adapt for which capability?"
    # groups are resolved at runtime by introspecting the loaded model (no per-model hardcoding):
    #   docvlm_eval.finetune.lora_vlm.resolve_lora_targets(model, group)
    factor: "target group: vision | connector | vision_connector | llm_attn | llm_mlp | all"
    control: "rank/alpha/lr/steps fixed for discovery; vision vs vision_connector is repeated with
              matched LoRA trainable parameters in configs/lora_vision_connector_sweep.yaml"
    metrics: [per_axis]
    hypothesis: "spatial/grounding <- vision+connector ; reasoning & language <- llm_attn+mlp"

  - id: A6_hpo
    question: "Best LoRA rank/alpha/lr/epochs for the chosen placement?"
    factor: "r in {8,16,32,64}; alpha; lr; epochs"
    control: "placement = A5 winner"
    metrics: [composite, overfit_gap]
    hypothesis: "moderate r (16-32) best; high r overfits small data"

  - id: A7_preprocessing
    question: "Effect of resize/tiling logic on small-text + layout (and rotation)?"
    factor: "dynamic tiling (n_max) vs fixed resize; max-resolution; keep-aspect"
    data_arm: {lowres: A7_fixed_lowres, highres: A7_highres, tiling: A7_dynamic_tiling,
               squash: A7_squash_aspect}
    control: "model/data fixed"
    closes_gap: [rotation_180]
    metrics: [smalltext_ned, cap_text, rotation_retention]
    hypothesis: "higher-res dynamic tiling -> small-text up; orientation aug -> 180-deg retention up"

# Cumulative staircase order (per model); each step re-evaluated on the same probe suite:
integration_order: [baseline, A7_preprocessing, A1_spotting, A2_reasoning,
                    A4_multilingual, A5_lora_placement, A6_hpo]

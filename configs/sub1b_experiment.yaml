# End-to-end executable experiment for the native sub-1B document VLM.
# Inspect the complete DAG without changing files:
#   python scripts/run_student_experiment.py --dry-run

schema_version: 1
name: docvlm-800m-hard
blueprint: configs/sub1b_architecture.yaml
output_root: outputs/docvlm-800m-hard

runtime:
  device: auto
  visual_backend_benchmark:
    enabled: true
    patch_grids: [[40, 63], [63, 40]]
    backends: [loop, auto, flex, dense_adaptive, dense_fixed_square]
    warmup_iterations: 3
    iterations: 10
    rounds: 3
    mode: training
    precision: auto
    seed: 7
    parity_atol: null
    # Optional redundant early check; the deployment gate below also requires FlexAttention.
    require_flex: false
    # Block initialization unless parity, speed, and memory deployment thresholds pass.
    require_deployment_gate: true
    wandb_project: null
    wandb_entity: null
    wandb_run: null
    wandb_group: visual-backend-gate
    wandb_tags: [native-student, visual-backend]
  training_feasibility_benchmark:
    enabled: true
    patch_grid: [40, 63]
    text_tokens: 2048
    micro_batch_size: 1
    warmup_steps: 1
    measured_steps: 2
    packed_attention_backend: auto
    precision: bfloat16
    seed: 7
    # Block initialization unless full forward/backward/AdamW steps fit the target GPU.
    require_deployment_gate: true
    wandb_project: null
    wandb_entity: null
    wandb_run: null
    wandb_group: training-feasibility-gate
    wandb_tags: [native-student, full-training-step]

synthetic:
  enabled: true
  config: configs/synth_data.yaml
  cases:
    - hard_table
    - hard_chart
    - hard_investment
    - hard_science
    - hard_diagram
    - audit_packet
    - investment_dossier
  count: 100
  train_count: null
  validation_count: 10
  heldout_count: null
  difficulty_level: 5
  train_seed: 7
  validation_seed: 3507
  heldout_seed: 7007
  no_degrade: false
  variant: degraded
  # Set this to a prior run's training-authorized next_train_plan.json to
  # replace the fixed train generation above with failure-driven allocation.
  training_policy_plan: null
  adaptation_policy:
    enabled: true
    config: configs/sub1b_synthesis_policy.yaml
    budget: 700
    seed: 9107

data:
  # Add public components as additional NAME/path/weight entries. Weights must sum to 1.
  # A component can set fold: train when its on-disk UDD dataset contains a fold column.
  components:
    - name: synthetic_documents
      path: "@synthetic"
      weight: 0.45
    - name: public_udd
      weight: 0.55
      hub:
        repo_id: danelcsb/UDD
        revision: f5eb52104627d20ddd1eab2130ad78f87cb0d7c9
        split: train
        fold: train
        sources: []
        tasks: []
        languages: []
        max_rows: null
        seed: 7
        decode_checks: 32

sequence_teacher:
  enabled: true
  model: lfm2_5-vl-1.6b
  revision: 919fde3d022e3f90a4716006f993938ee8c2eb97
  predictions: null
  device: cuda
  dtype: bfloat16
  max_new_tokens: 128
  temperature: 0.0
  min_score: 0.8
  min_acceptance_rate: 0.1
  max_requests: 4096
  accepted_target_count: 400
  selection_seed: 7
  target_probability: 0.5
  target_format: answer
  seed: 7

tokenizer:
  vocab_size: null
  min_frequency: 2
  include_teacher_targets: false
  no_progress: true

initialization:
  arm: I0_random
  seed: 5
  device: cpu
  allow_full_memory: true
  tiny: false
  vision_source: null
  language_source: null
  token_map: null

continuation:
  enabled: false

pretraining:
  teacher_checkpoint: null
  epochs: null
  max_steps: null
  batch_size: null
  num_workers: null
  eval_group_by: component
  no_grounding: false
  wandb_project: null
  wandb_entity: null
  wandb_run: null
  wandb_group: null
  wandb_tags: [native-student, pretraining]

posttraining:
  sft:
    max_steps: null
    num_workers: null
    target_mode: evidence_linked
    wandb_project: null
    wandb_entity: null
    wandb_run: null
    wandb_group: null
    wandb_tags: [native-student, sft]
  preference:
    enabled: false
    max_steps: null
    wandb_project: null
    wandb_entity: null
    wandb_run: null
    wandb_group: null
    wandb_tags: [native-student, preference]
  rlvr:
    enabled: true
    max_steps: null
    replay_every_steps: null
    replay_loss_coefficient: null
    replay_samples: null
    wandb_project: null
    wandb_entity: null
    wandb_run: null
    wandb_group: null
    wandb_tags: [native-student, rlvr]

evaluation:
  max_new_tokens: 128
  max_samples: null
  use_kv_cache: true
  precision: bfloat16
  seed: 31
  temperature_calibration:
    enabled: true
    source_split: validation
    fraction: 0.2
    min_samples: 20
    correct_threshold: 0.5
    min_temperature: 0.05
    max_temperature: 20.0
    seed: 47
  wandb_project: null
  wandb_entity: null
  wandb_run: null
  wandb_group: null
  wandb_tags: [native-student, hard-documents]
  baseline_evaluation: null
  monolingual_control_evaluation: null

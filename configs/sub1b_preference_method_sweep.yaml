# Verifier-ranked DPO versus on-policy GRPO by three paired replicates.

schema_version: 1
name: docvlm-preference-method-ablation
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-preference-method-ablation
baseline: grpo

promotion:
  primary_metric: heldout_score
  direction: maximize
  minimum_effect: 0.005
  minimum_replicates: 3
  familywise_alpha: 0.05
  max_promotions: 1
  required_gates:
    - parameter_budget
    - generalization
    - grounding
    - reasoning
    - multilingual
    - reliability
  required_axis_deltas:
    L1-region: 0.0
    multilingual: 0.0

shared_experiment_patches:
  - {op: add, path: /evaluation/wandb_tags/-, value: posttraining-ablation}
  - {op: add, path: /evaluation/wandb_tags/-, value: preference-method-ablation}

shared_blueprint_patches:
  - {op: replace, path: /training/posttraining/preference/optimizer/max_steps, value: null}
  - {op: replace, path: /training/posttraining/preference/optimizer/total_student_flops, value: 192000000000000000}
  - {op: replace, path: /training/posttraining/preference/optimizer/stop_at_student_flops, value: true}
  - {op: replace, path: /training/posttraining/rlvr/optimizer/max_steps, value: null}
  - {op: replace, path: /training/posttraining/rlvr/optimizer/total_student_flops, value: 192000000000000000}
  - {op: replace, path: /training/posttraining/rlvr/optimizer/stop_at_student_flops, value: true}


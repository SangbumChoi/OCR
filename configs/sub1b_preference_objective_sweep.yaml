variants:
  - id: dpo
    hypothesis: "Tests the unbounded log-sigmoid preference objective."

  - id: ipo
    hypothesis: "Tests finite-margin identity preference optimization."
    blueprint_patches:
      - op: replace
        path: /training/posttraining/preference/objective
        value: ipo

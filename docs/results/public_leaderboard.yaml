# Public OCR / document-parsing benchmark leaderboard: source data.
#
# docs/report/public_leaderboard.md and docs/report/figures/public_leaderboard/*.png are GENERATED
# from this file by `python scripts/build_public_leaderboard.py`. Edit numbers here, never in the
# generated page.
#
# Scope: publicly released models only, measured on public benchmarks with each benchmark's
# official scorer, run 2026-11-01. Per row: `scores` follow the benchmark's `columns`; null = the
# official scorer halted on that model's predictions. `reported` is the number the model's authors
# published, for reference.


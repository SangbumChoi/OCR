# Gold-anchored versus reference-only DPO candidates by three paired replicates.

schema_version: 1
name: docvlm-preference-source-ablation
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-preference-source-ablation
baseline: reference_only

promotion:
  primary_metric: heldout_score
  direction: maximize
  minimum_effect: 0.005
  minimum_replicates: 3
  familywise_alpha: 0.05
  max_promotions: 1
  required_gates:
    - parameter_budget
    - generalization
    - grounding
    - reasoning
    - multilingual
    - reliability
  required_axis_deltas:
    L1-region: 0.0
    multilingual: 0.0

shared_experiment_patches:
  - {op: replace, path: /posttraining/preference/enabled, value: true}
  - {op: replace, path: /posttraining/rlvr/enabled, value: false}
  - {op: add, path: /evaluation/wandb_tags/-, value: posttraining-ablation}
  - {op: add, path: /evaluation/wandb_tags/-, value: preference-source-ablation}

shared_blueprint_patches:
  - {op: replace, path: /training/posttraining/preference/optimizer/max_steps, value: null}
  - {op: replace, path: /training/posttraining/preference/optimizer/total_student_flops, value: 192000000000000000}
  - {op: replace, path: /training/posttraining/preference/optimizer/stop_at_student_flops, value: true}

matched_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/count}
  - {document: experiment, path: /synthetic/train_count}
  - {document: experiment, path: /synthetic/heldout_count}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /data/components}
  - {document: experiment, path: /data/components/1/hub/seed}
  - {document: experiment, path: /sequence_teacher/seed}
  - {document: experiment, path: /pretraining/max_steps}
  - {document: experiment, path: /posttraining/sft/max_steps}
  - {document: experiment, path: /posttraining/sft/target_mode}
  - {document: experiment, path: /posttraining/preference/enabled}
  - {document: experiment, path: /posttraining/preference/max_steps}
  - {document: experiment, path: /posttraining/rlvr/enabled}
  - {document: experiment, path: /evaluation/max_samples}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/pretraining/optimizer/total_tokens}
  - {document: blueprint, path: /training/pretraining/optimizer/epochs}
  - {document: blueprint, path: /training/activation_checkpointing}
  - {document: blueprint, path: /training/posttraining/sft/target_mode}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/total_tokens}
  - {document: blueprint, path: /training/posttraining/preference/objective}
  - {document: blueprint, path: /training/posttraining/preference/reference_policy}
  - {document: blueprint, path: /training/posttraining/preference/group_size}
  - {document: blueprint, path: /training/posttraining/preference/minimum_reward_margin}
  - {document: blueprint, path: /training/posttraining/preference/dpo_beta}
  - {document: blueprint, path: /training/posttraining/preference/ipo_tau}
  - {document: blueprint, path: /training/posttraining/preference/sequence_reduction}
  - {document: blueprint, path: /training/posttraining/preference/rollout}
  - {document: blueprint, path: /training/posttraining/preference/optimizer/max_steps}
  - {document: blueprint, path: /training/posttraining/preference/optimizer/total_student_flops}

# Three-seed CPU proxy for the selective-transfer comparison and evidence chain.
# Fixture weights are random, so this suite cannot authorize a quality promotion.

schema_version: 1
name: docvlm-selective-transfer-fixture-sweep
base_experiment: configs/sub1b_experiment_selective_tiny.yaml
output_root: outputs/sweeps/docvlm-selective-transfer-fixture-sweep
baseline: random

matched_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/count}
  - {document: experiment, path: /synthetic/validation_count}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/validation_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /synthetic/adaptation_policy/seed}
  - {document: experiment, path: /data/components}
  - {document: experiment, path: /pretraining/max_steps}
  - {document: experiment, path: /posttraining/sft/max_steps}
  - {document: experiment, path: /posttraining/rlvr/max_steps}
  - {document: experiment, path: /evaluation/max_samples}
  - {document: experiment, path: /evaluation/seed}
  - {document: experiment, path: /sequence_teacher/selection_seed}
  - {document: experiment, path: /sequence_teacher/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}

replicate_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/validation_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /synthetic/adaptation_policy/seed}
  - {document: experiment, path: /evaluation/seed}
  - {document: experiment, path: /sequence_teacher/selection_seed}
  - {document: experiment, path: /sequence_teacher/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}

replicates:
  - id: seed_0
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 5}
      - {op: replace, path: /synthetic/train_seed, value: 17}
      - {op: replace, path: /synthetic/validation_seed, value: 10017}
      - {op: replace, path: /synthetic/heldout_seed, value: 20017}
      - {op: replace, path: /synthetic/adaptation_policy/seed, value: 30017}
      - {op: replace, path: /evaluation/seed, value: 31}
      - {op: replace, path: /sequence_teacher/selection_seed, value: 7}
      - {op: replace, path: /sequence_teacher/seed, value: 7}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 7}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 7}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 17}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 23}

  - id: seed_1
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 105}
      - {op: replace, path: /synthetic/train_seed, value: 117}
      - {op: replace, path: /synthetic/validation_seed, value: 10117}
      - {op: replace, path: /synthetic/heldout_seed, value: 20117}
      - {op: replace, path: /synthetic/adaptation_policy/seed, value: 30117}
      - {op: replace, path: /evaluation/seed, value: 131}
      - {op: replace, path: /sequence_teacher/selection_seed, value: 107}
      - {op: replace, path: /sequence_teacher/seed, value: 107}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 107}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 107}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 117}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 123}

  - id: seed_2
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 205}
      - {op: replace, path: /synthetic/train_seed, value: 217}
      - {op: replace, path: /synthetic/validation_seed, value: 10217}
      - {op: replace, path: /synthetic/heldout_seed, value: 20217}
      - {op: replace, path: /synthetic/adaptation_policy/seed, value: 30217}
      - {op: replace, path: /evaluation/seed, value: 231}
      - {op: replace, path: /sequence_teacher/selection_seed, value: 207}
      - {op: replace, path: /sequence_teacher/seed, value: 207}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 207}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 207}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 217}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 223}

variants:
  - id: random
    hypothesis: "Measures the one-step tiny recipe without inherited parameters."
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I0_random}
      - {op: remove, path: /initialization/vision_family}
      - {op: remove, path: /initialization/vision_source}
      - {op: remove, path: /initialization/language_family}
      - {op: remove, path: /initialization/language_source}

  - id: structured_fixture
    hypothesis: "Exercises exact and structured-MLP transfer from deterministic cross-architecture fixture checkpoints."
    experiment_patches:
      - {op: add, path: /evaluation/wandb_tags/-, value: fixture-transfer-treatment}

contrasts:
  - id: fixture_transfer_effect
    hypothesis: "Measures the paired proxy effect of fixture transfer without authorizing a pretrained-weight quality claim."
    coefficients:
      random: -1.0
      structured_fixture: 1.0

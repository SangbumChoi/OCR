# Batch-only contrastive learning versus a local memory queue by three paired replicates.

schema_version: 1
name: docvlm-contrastive-memory-ablation
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-contrastive-memory-ablation
baseline: memory_1024

shared_experiment_patches:
  - {op: add, path: /evaluation/wandb_tags/-, value: pretraining-ablation}
  - {op: add, path: /evaluation/wandb_tags/-, value: contrastive-memory-ablation}

shared_blueprint_patches:
  - {op: replace, path: /training/pretraining/optimizer/epochs, value: null}
  - {op: replace, path: /training/pretraining/optimizer/max_steps, value: null}
  - {op: replace, path: /training/pretraining/optimizer/stop_at_total_tokens, value: false}
  - {op: replace, path: /training/pretraining/optimizer/warmup_student_flops, value: 828349158744834946}
  - {op: replace, path: /training/pretraining/optimizer/total_student_flops, value: 165669831748966989312}
  - {op: replace, path: /training/pretraining/optimizer/stop_at_student_flops, value: true}
  - {op: replace, path: /training/pretraining/optimizer/schedule_unit, value: student_flops}
  - {op: replace, path: /training/pretraining/curriculum/unit, value: training_compute_fraction}

matched_controls:

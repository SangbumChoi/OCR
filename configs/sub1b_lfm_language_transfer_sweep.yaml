# Native versus LFM-aligned language operators with an aligned-transfer arm.

schema_version: 1
name: docvlm-lfm-language-transfer-sweep
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-lfm-language-transfer-sweep
baseline: lfm_random

promotion:
  primary_metric: heldout_score
  direction: maximize
  minimum_effect: 0.005
  minimum_replicates: 3
  familywise_alpha: 0.05
  max_promotions: 1
  eligible_variants:
    - lfm_strict_transfer
  required_gates:
    - parameter_budget
    - generalization
    - grounding
    - reasoning
    - multilingual
    - reliability
  required_axis_deltas:
    L1-locate: 0.0
    L1-region: 0.0
    H-comprehension: 0.0
    H-accounting: 0.0
    multilingual: 0.0
    ocr-full: 0.0
    reading-order: 0.0

shared_experiment_patches:
  - {op: add, path: /initialization/language_family, value: lfm2}
  - op: replace
    path: /initialization/language_source
    value:
      hub:
        repo_id: LiquidAI/LFM2.5-VL-1.6B
        revision: 919fde3d022e3f90a4716006f993938ee8c2eb97
  - {op: replace, path: /runtime/visual_backend_benchmark/wandb_project, value: docvlm-ablation}
  - {op: replace, path: /runtime/visual_backend_benchmark/wandb_entity, value: sbdc}
  - {op: replace, path: /runtime/training_feasibility_benchmark/wandb_project, value: docvlm-ablation}
  - {op: replace, path: /runtime/training_feasibility_benchmark/wandb_entity, value: sbdc}
  - {op: replace, path: /pretraining/wandb_project, value: docvlm-ablation}
  - {op: replace, path: /pretraining/wandb_entity, value: sbdc}
  - {op: replace, path: /posttraining/sft/wandb_project, value: docvlm-ablation}
  - {op: replace, path: /posttraining/sft/wandb_entity, value: sbdc}
  - {op: replace, path: /posttraining/rlvr/wandb_project, value: docvlm-ablation}
  - {op: replace, path: /posttraining/rlvr/wandb_entity, value: sbdc}
  - {op: replace, path: /evaluation/wandb_project, value: docvlm-ablation}
  - {op: replace, path: /evaluation/wandb_entity, value: sbdc}
  - {op: add, path: /evaluation/wandb_tags/-, value: lfm-language-transfer-sweep}
  - {op: add, path: /evaluation/wandb_tags/-, value: operator-semantic-gate}

matched_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /initialization/language_family}
  - {document: experiment, path: /initialization/language_source}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /data/components}
  - {document: experiment, path: /pretraining/max_steps}
  - {document: experiment, path: /posttraining/sft/max_steps}
  - {document: experiment, path: /posttraining/rlvr/max_steps}
  - {document: experiment, path: /evaluation/max_samples}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}
  - {document: blueprint, path: /training/pretraining/optimizer/total_tokens}

replicate_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}

replicates:
  - id: seed_0
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 5}
      - {op: replace, path: /synthetic/train_seed, value: 7}
      - {op: replace, path: /synthetic/heldout_seed, value: 7007}
      - {op: replace, path: /evaluation/seed, value: 31}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 7}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 7}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 17}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 23}

  - id: seed_1
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 105}
      - {op: replace, path: /synthetic/train_seed, value: 107}
      - {op: replace, path: /synthetic/heldout_seed, value: 7107}
      - {op: replace, path: /evaluation/seed, value: 131}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 107}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 107}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 117}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 123}

  - id: seed_2
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 205}
      - {op: replace, path: /synthetic/train_seed, value: 207}
      - {op: replace, path: /synthetic/heldout_seed, value: 7207}
      - {op: replace, path: /evaluation/seed, value: 231}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 207}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 207}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 217}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 223}

variants:
  - id: native_random
    hypothesis: "Measures the native 1536-wide all-attention language operator from random initialization."
    decision_metrics: {language_width: 1536, language_layers: 23, expected_transfer_groups: 0}
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I0_random}

  - id: lfm_random
    hypothesis: "Measures the sub-1B LFM-aligned hybrid operator without inherited language weights."
    decision_metrics: {language_width: 2048, language_layers: 12, expected_transfer_groups: 0}
    blueprint_patches: &lfm_geometry
      - {op: replace, path: /tokenizer/vocab_size, value: 65536}
      - {op: replace, path: /student/language/vocab_size, value: 65536}
      - {op: replace, path: /student/language/width, value: 2048}
      - {op: replace, path: /student/language/layers, value: 12}
      - {op: replace, path: /student/language/attention_heads, value: 32}
      - {op: replace, path: /student/language/kv_heads, value: 8}
      - {op: replace, path: /student/language/mlp_width, value: 5120}
      - {op: replace, path: /student/language/rope_base, value: 1000000.0}
      - {op: replace, path: /student/language/rope_layout, value: half_split}
      - {op: replace, path: /student/language/norm_eps, value: 0.00001}
      - {op: replace, path: /student/language/qk_norm, value: true}
      - {op: replace, path: /student/language/attention_bias, value: false}
      - {op: replace, path: /student/language/mlp_bias, value: false}
      - {op: replace, path: /student/language/full_attention_layers, value: [2, 5, 8, 10]}
      - {op: replace, path: /student/language/conv_kernel_size, value: 3}
      - {op: replace, path: /student/language/conv_bias, value: false}
      - {op: replace, path: /student/connector/output_width, value: 2048}
      - {op: replace, path: /student/connector/layers, value: 1}
      - {op: replace, path: /student/connector/attention_heads, value: 16}
      - {op: replace, path: /student/connector/mlp_width, value: 4096}
      - op: replace
        path: /training/pretraining/distillation/language_layer_pairs
        value: [[2, 2], [5, 5], [8, 8], [11, 11]]

  - id: lfm_strict_transfer
    hypothesis: "Measures exact LFM attention/convolution transfer plus structured SwiGLU reduction."
    decision_metrics: {language_width: 2048, language_layers: 12, expected_transfer_groups: 3}
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I8_lfm_aligned_language}
    blueprint_patches: *lfm_geometry

contrasts:
  - id: geometry_effect_without_transfer
    hypothesis: "Effect of the LFM-aligned operator under random initialization."
    coefficients: {native_random: -1, lfm_random: 1}
  - id: transfer_effect_lfm_geometry
    hypothesis: "Strict LFM transfer effect under an aligned operator."
    coefficients: {lfm_random: -1, lfm_strict_transfer: 1}
  - id: aligned_transfer_end_to_end
    hypothesis: "End-to-end effect of adopting both the aligned operator and strict initialization."
    coefficients: {native_random: -1, lfm_strict_transfer: 1}

# GIoU, DIoU, and CIoU box objectives by three paired replicates.

schema_version: 1
name: docvlm-box-iou-loss-ablation
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-box-iou-loss-ablation
baseline: giou

promotion:
  primary_metric: axis.L1-region
  direction: maximize
  minimum_effect: 0.005
  minimum_replicates: 3
  familywise_alpha: 0.05
  max_promotions: 1
  required_gates:
    - parameter_budget
    - generalization
    - grounding
    - reasoning
    - multilingual
    - reliability
  required_axis_deltas:
    L1-locate: 0.0
    ocr-full: 0.0
    multilingual: 0.0

shared_experiment_patches:
  - {op: add, path: /evaluation/wandb_tags/-, value: pretraining-ablation}
  - {op: add, path: /evaluation/wandb_tags/-, value: box-iou-loss-ablation}

shared_blueprint_patches:
  - {op: replace, path: /training/pretraining/optimizer/epochs, value: null}
  - {op: replace, path: /training/pretraining/optimizer/max_steps, value: null}
  - {op: replace, path: /training/pretraining/optimizer/stop_at_total_tokens, value: false}
  - {op: replace, path: /training/pretraining/optimizer/warmup_student_flops, value: 828349158744834946}
  - {op: replace, path: /training/pretraining/optimizer/total_student_flops, value: 165669831748966989312}
  - {op: replace, path: /training/pretraining/optimizer/stop_at_student_flops, value: true}
  - {op: replace, path: /training/pretraining/optimizer/schedule_unit, value: student_flops}
  - {op: replace, path: /training/pretraining/curriculum/unit, value: training_compute_fraction}

matched_controls:
  - {document: blueprint, path: /student}
  - {document: blueprint, path: /tokenizer}
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/count}
  - {document: experiment, path: /synthetic/train_count}
  - {document: experiment, path: /synthetic/heldout_count}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /data/components}

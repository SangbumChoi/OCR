# Four-run CPU contract: two arms by two paired replicates.

schema_version: 1
name: docvlm-tiny-sweep
base_experiment: configs/sub1b_experiment_tiny.yaml
output_root: outputs/sweeps/docvlm-tiny-sweep
baseline: baseline

promotion:
  primary_metric: heldout_score
  direction: maximize
  minimum_effect: 0.05
  minimum_replicates: 2
  familywise_alpha: 0.05
  max_promotions: 1
  required_gates:
    - parameter_budget
    - generalization

matched_controls:
  - document: experiment
    path: /initialization/seed
  - document: experiment
    path: /synthetic/count
  - document: experiment
    path: /synthetic/train_count
  - document: experiment
    path: /synthetic/heldout_count
  - document: experiment
    path: /synthetic/train_seed
  - document: experiment
    path: /synthetic/heldout_seed
  - document: experiment
    path: /data/components
  - document: experiment
    path: /pretraining/max_steps
  - document: experiment
    path: /posttraining/sft/max_steps
  - document: experiment
    path: /posttraining/rlvr/max_steps
  - document: experiment
    path: /evaluation/max_samples
  - document: experiment
    path: /evaluation/seed
  - document: experiment
    path: /sequence_teacher/seed
  - document: blueprint
    path: /training/pretraining/input_pipeline/augmentation_seed
  - document: blueprint
    path: /training/pretraining/optimizer/seed
  - document: blueprint
    path: /training/posttraining/sft/optimizer/seed
  - document: blueprint
    path: /training/posttraining/rlvr/optimizer/seed

replicate_controls:
  - document: experiment
    path: /initialization/seed
  - document: experiment
    path: /synthetic/train_seed
  - document: experiment
    path: /synthetic/heldout_seed
  - document: experiment
    path: /sequence_teacher/seed
  - document: experiment
    path: /evaluation/seed
  - document: blueprint
    path: /training/pretraining/input_pipeline/augmentation_seed
  - document: blueprint
    path: /training/pretraining/optimizer/seed
  - document: blueprint
    path: /training/posttraining/sft/optimizer/seed
  - document: blueprint
    path: /training/posttraining/rlvr/optimizer/seed

replicates:
  - id: seed_0
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 5}
      - {op: replace, path: /synthetic/train_seed, value: 17}
      - {op: replace, path: /synthetic/heldout_seed, value: 17017}
      - {op: replace, path: /sequence_teacher/seed, value: 7}
      - {op: replace, path: /evaluation/seed, value: 31}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 7}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 7}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 17}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 23}
  - id: seed_1
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 105}
      - {op: replace, path: /synthetic/train_seed, value: 117}
      - {op: replace, path: /synthetic/heldout_seed, value: 17117}
      - {op: replace, path: /sequence_teacher/seed, value: 107}
      - {op: replace, path: /evaluation/seed, value: 131}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 107}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 107}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 117}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 123}

variants:
  - id: baseline
    hypothesis: "Exercises the complete tiny pipeline with offline sequence-target selection."

  - id: no_sequence_distillation
    hypothesis: "Exercises a matched tiny pipeline without sequence-teacher stages."
    experiment_patches:
      - op: replace
        path: /sequence_teacher/enabled
        value: false

contrasts:
  - id: sequence_distillation_effect
    hypothesis: "Measures the paired effect of removing sequence distillation."
    coefficients:
      baseline: -1.0
      no_sequence_distillation: 1.0

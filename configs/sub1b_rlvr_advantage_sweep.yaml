      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 7}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 7}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 17}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 23}

  - id: seed_1
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 105}
      - {op: replace, path: /synthetic/train_seed, value: 107}
      - {op: replace, path: /synthetic/heldout_seed, value: 7107}
      - {op: replace, path: /sequence_teacher/seed, value: 107}
      - {op: replace, path: /data/components/1/hub/seed, value: 107}
      - {op: replace, path: /evaluation/seed, value: 131}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 107}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 107}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 117}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 123}

  - id: seed_2
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 205}
      - {op: replace, path: /synthetic/train_seed, value: 207}
      - {op: replace, path: /synthetic/heldout_seed, value: 7207}
      - {op: replace, path: /sequence_teacher/seed, value: 207}
      - {op: replace, path: /data/components/1/hub/seed, value: 207}
      - {op: replace, path: /evaluation/seed, value: 231}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 207}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 207}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 217}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 223}

variants:
  - id: group_standardized
    hypothesis: "Tests the current GRPO reward-centering and within-group standardization."

  - id: leave_one_out
    hypothesis: "Tests RLOO advantages without erasing the verifier reward scale."
    blueprint_patches:
      - op: replace
        path: /training/posttraining/rlvr/advantage_estimator
        value: leave_one_out

  - {document: blueprint, path: /training/pretraining/curriculum}
  - {document: blueprint, path: /training/pretraining/optimizer}
  - {document: blueprint, path: /training/pretraining/optimizer/max_steps}
  - {document: blueprint, path: /training/pretraining/optimizer/learning_rate}
  - {document: blueprint, path: /training/pretraining/optimizer/weight_decay}
  - {document: blueprint, path: /training/pretraining/optimizer/betas}
  - {document: blueprint, path: /training/pretraining/optimizer/max_grad_norm}
  - {document: blueprint, path: /training/pretraining/optimizer/precision}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/pretraining/optimizer/warmup_student_flops}
  - {document: blueprint, path: /training/pretraining/optimizer/total_student_flops}

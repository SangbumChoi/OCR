variants:
  - id: memory_1024
    hypothesis: "A detached FIFO supplies effective cross-document negatives at production micro-batch size one and improves heldout document alignment."

  - id: batch_only
    hypothesis: "Batch-only contrastive learning is sufficient despite the one-image production microbatch."
    blueprint_patches:
      - {op: replace, path: /training/pretraining/contrastive_memory/enabled, value: false}

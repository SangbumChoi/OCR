# Synthetic-data generation config (binds to docvlm_eval.synth.dto.GenConfig).
#
# One file = one dataset variant. `base` holds the default knobs; `ablation_overrides` holds the
# per-experiment deltas for the ablation study (docs/report/ablation_plan.md). Generate with:
#
#   python scripts/make_realistic_cases.py --config configs/synth_data.yaml                # base
#   python scripts/make_realistic_cases.py --config configs/synth_data.yaml --ablation A1_spotting
#
# Each ablation changes EXACTLY ONE family of factors vs. base, so a measured gain is attributable.
# Data-side factors map onto the GT DTO as: A1->bbox, A2->rationale, A4->language/script,
# A7->render(dpi/target_long_side/keep_aspect/tiling)+small-text. A5/A6 are training-side.

base:
  name: base
  seed: 7
  count: 1

  # --- A7 render / preprocessing (recorded in RenderSpec; controls the IMAGE distribution) ---
  dpi: 150                  # digital-native PDF rasterised at this DPI
  target_long_side: null    # null = native render size; set e.g. 1024 to resize longest side
  keep_aspect: true
  tiling_n_max: null        # set e.g. 12 to record dynamic-tiling metadata (n_max tiles)
  small_text_px: 10.0       # fields rendered at/below this px are the small-text slice (e.g. MRZ)

  # --- A1 / A2 supervision targets to EMIT in the GT ---
  emit_spotting: true       # A1: include bbox targets (Field.bbox / QAItem.answer_bbox)
  emit_rationale: true      # A2: include chain-of-thought rationales
  emit_understanding: true  # model-free understanding GT (where / how-many / totals) from derive.py
  emit_counterfactual_pairs: true  # adjacent hard docs share locale/style but edit latent values
  # Fall back to a layout-neutral color-probe render when the PDF text layer cannot resolve
  # a required spotting/grounding span (notably CJK, RTL, letter-spaced, or wrapped text).
  color_probe_fallback: true
  # Reject requested-but-unresolved, clipped, or visually blank evidence boxes after the final
  # resize and supervision projection. Metrics compare each crop with its local background.
  validate_evidence_pixels: true
  evidence_min_contrast: 8.0
  evidence_min_foreground_fraction: 0.002
  evidence_min_foreground_pixels: 4
  # Degraded copies must preserve both local visibility and clean-crop structure. Runtime or
  # quality failures retry a deterministic seed sequence before generation fails closed.
  validate_degraded_evidence: true
  degraded_min_structure_correlation: 0.25
  degrade_max_attempts: 3
  # Same-frame perspective geometry for photo-style clean/degraded pairs. Boxes are transformed
  # by the exact homography and stored as axis-aligned envelopes in the warped pixel frame.
  perspective_prob: 0.35
  perspective_max_inset_fraction: 0.08
  perspective_min_area_ratio: 0.70
  overlay_prob: 0.35
  overlay_types: [handwriting, stamp, seal]
  overlay_max_count: 2

  # --- visual diversity: per-doc paper/accent/font/margin jitter (geometry-safe; boxes stay exact) ---
  jitter: true

  # --- textual source. "offline" = Faker/locale + curated pools, NO network/LLM (the only wired mode).
  #     "corpus"/"llm" are future-optional seams (docs/report/synth_generation_survey.md §4). ---
  text_source: offline

  # --- A4 multilingual mix (real-world script distribution) ---
  languages: [en, es, ko, ja, zh]
  language_weights: {en: 0.35, es: 0.15, ko: 0.20, ja: 0.15, zh: 0.15}

  # --- realism / distribution matching (real-world acquisition mix) ---
  degrade_prob: 1.0         # fraction of docs that also get a degraded copy
  degrade_severity: 1.0
  degrade_presets: null     # null = each case's default preset; or per-type override, e.g.
                            #   invoice: [scan, photo]   prescription: [fax]
  doc_type_weights: null    # null = uniform over the requested cases

  # --- executable hard-document curriculum and leakage-safe split provenance ---
  difficulty_level: 4       # 1=direct reading, 5=multi-hop/cross-region with distractors
  hard_layout_families: [classic-v1, compact-v1, report-v1]
  split_name: synthetic     # set train/validation/heldout when materializing a named split
  split_seed: 7             # deterministic suggested split assignment for semantic fingerprints
  split_group_by: content   # content | template | layout | document

# ----------------------------------------------------------------------------------------------
# Ablation overrides — applied on top of `base` (deep-merged) when --ablation <id> is passed.
# These are the *data-side* arms; the paired control is `base` itself unless noted.
# ----------------------------------------------------------------------------------------------
ablation_overrides:

  # A1 — spotting supervision. Arm = boxes ON (base), control = boxes OFF (this override).
  A1_spotting_off:
    emit_spotting: false
    emit_rationale: false   # isolate spotting: turn reasoning off too so only boxes differ vs A1 arm

  A1_spotting_on:
    emit_spotting: true
    emit_rationale: false

  # A2 — reasoning supervision. Arm = rationale ON, control = rationale OFF.
  A2_reasoning_off:
    emit_spotting: false
    emit_rationale: false

  A2_reasoning_on:
    emit_spotting: false
    emit_rationale: true

  # A3 — spot+reason vs combined-direct: the four corners of {spot} x {reason}.
  A3_answer_only:     {emit_spotting: false, emit_rationale: false}
  A3_spot_only:       {emit_spotting: true,  emit_rationale: false}
  A3_reason_only:     {emit_spotting: false, emit_rationale: true}
  A3_spot_and_reason: {emit_spotting: true,  emit_rationale: true}

  # A4 — multilingual mixing & language correlation. Equal total samples across arms (count fixed).
  A4_en:        {languages: [en], language_weights: null}
  A4_en_es:     {languages: [en, es], language_weights: null}
  A4_en_ja:     {languages: [en, ja], language_weights: null}
  A4_ko_en:     {languages: [ko, en], language_weights: null}
  A4_en_zh:     {languages: [en, zh], language_weights: null}
  A4_all:       {languages: [en, es, ko, ja, zh], language_weights: null}

  # Understanding layer (model-free where/how-many/totals) on vs off — isolates its contribution.
  U_understanding_off: {emit_understanding: false}
  U_understanding_on:  {emit_understanding: true}

  # --- the two synthetic-quality axes we scale (see docs/report/synthetic_data_dto.md) ---
  # (1) VISUAL DIVERSITY — image kinds (14 doc types, fixed) x acquisition/lighting/colour. This arm
  #     randomises the degradation preset per doc (scan/photo/fax/historical) -> varied lighting,
  #     colour cast, contrast; degrade_prob=1 so every doc gets a degraded copy.
  D_visual_diverse:
    degrade_prob: 1.0
    degrade_presets:
      invoice: [scan, photo, fax]
      id_card: [photo, scan]
      bank_statement: [scan, photo, fax]
      cheque: [scan, photo]
      prescription: [fax, photo, historical]
      checkbox_form: [scan, fax]
      redacted: [scan, fax]
      website: [screenshot]
      mobile_app: [screenshot]
      pdf_paper: [scan, photo]
      ancient: [historical, fax]
  # (2) ANNOTATION DIFFICULTY — harder GT (multi-step accounting, MRZ field-parse, extremes diff,
  #     next-action) is always emitted with the understanding layer; toggle it as a whole here.
  D_difficulty_on:  {emit_understanding: true,  emit_rationale: true}
  D_difficulty_off: {emit_understanding: false, emit_rationale: false}
  D_hard_level_1:   {difficulty_level: 1}
  D_hard_level_3:   {difficulty_level: 3}
  D_hard_level_5:   {difficulty_level: 5}
  D_hard_layout_classic: {hard_layout_families: [classic-v1]}
  D_hard_layout_diverse: {hard_layout_families: [classic-v1, compact-v1, report-v1]}
  D_color_probe_off: {color_probe_fallback: false}
  D_color_probe_on:  {color_probe_fallback: true}
  D_perspective_off: {perspective_prob: 0.0}
  D_perspective_on:  {perspective_prob: 1.0}
  D_overlays_off: {overlay_prob: 0.0}
  D_overlays_on:  {overlay_prob: 1.0}

  # A7 — preprocessing / resize logic. Control = fixed low-res; arms raise resolution / add tiling.
  A7_fixed_lowres:    {target_long_side: 768,  keep_aspect: true,  tiling_n_max: null, dpi: 110}
  A7_highres:         {target_long_side: 1536, keep_aspect: true,  tiling_n_max: null, dpi: 200}
  A7_dynamic_tiling:  {target_long_side: 1536, keep_aspect: true,  tiling_n_max: 12,   dpi: 200}
  A7_squash_aspect:   {target_long_side: 1024, keep_aspect: false, tiling_n_max: null, dpi: 150}

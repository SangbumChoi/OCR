[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docvlm-eval"
version = "0.1.0"
description = "Reproducible evaluation harness + improvement PoC for sub-1B document-understanding VLMs (with a LoRA fine-tuning subpackage)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sangbum Choi" }]
keywords = ["VLM", "OCR", "document-understanding", "evaluation", "benchmark"]

# Lightweight core: enough to run the pipeline + metrics + dummy model + catalog.
# Heavy model/runtime deps live in the optional `models` extra so `pip install` stays small
# and CI can test metrics/pipeline without torch.
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Running real VLMs + building benchmarks from HuggingFace.
models = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    # remote-code models (InternVL/Ovis/PaddleOCR-VL/H2OVL/Florence-2) ship code written for
    # transformers 4.x; transformers 5.x breaks them (all_tied_weights_keys / forced_bos_token_id).
    # 4.49 also covers GOT-OCR2 + SmolVLM(ImageTextToText). Pin <5 for a working remote-code sweep.
    "transformers>=4.49,<5",
    "tokenizers>=0.20.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "einops>=0.8.0",
    "sentencepiece>=0.2.0",
    "timm>=1.0.0",
]
# Part-2 LoRA fine-tuning subpackage (docvlm_eval.finetune).
finetune = ["peft>=0.12.0", "wandb>=0.17.0", "accelerate>=0.33.0"]
# Native approximately 800M student construction, selective transfer, and pre/post-training.
student = [
    "torch>=2.3.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.20.0",
    "datasets>=2.20.0",
]
# Newer 2025-26 bases (Qwen3.5-VL, LFM2.5-VL, MiniCPM-V-4.6) need transformers >=5 — which is
# INCOMPATIBLE with the remote-code sweep's `models` pin (<5), so they get their own extra. Use
# this (not `models`) for the fine-tuning bases / the side-by-side + fine-grained notebooks.
newvlms = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "transformers>=5.0",
    "torchao>=0.16.0",            # Qwen3.5-VL / transformers>=5 quantization+kernels need it
    "accelerate>=0.33.0",
    "timm>=1.0.0",
    "sentencepiece>=0.2.0",
    "einops>=0.8.0",
]
# Report rendering + figures.
report = ["markdown>=3.6", "weasyprint>=62.0", "matplotlib>=3.8"]
# Realistic synthetic data generator (scripts/make_realistic_cases.py): HTML/CSS -> WeasyPrint
# -> PDF -> PyMuPDF (rasterize + exact GT boxes) -> Augraphy (scanner/photo degradation), with
# Faker for deterministic field values. Reuses weasyprint from [report].
synth = ["weasyprint>=62.0", "pymupdf>=1.24", "faker>=25.0", "augraphy>=8.2", "qrcode>=7.4"]
# Tests + lint.
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
docvlm-eval = "docvlm_eval.cli:evaluate"
docvlm-build-bench = "docvlm_eval.cli:build_benchmarks"
docvlm-fetch = "docvlm_eval.cli:fetch_samples"
docvlm-robustness = "docvlm_eval.cli:build_robustness"
docvlm-table = "docvlm_eval.cli:comparison_table"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

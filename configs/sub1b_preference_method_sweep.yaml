      - {op: replace, path: /synthetic/train_seed, value: 107}
      - {op: replace, path: /synthetic/heldout_seed, value: 7107}
      - {op: replace, path: /sequence_teacher/seed, value: 107}
      - {op: replace, path: /data/components/1/hub/seed, value: 107}

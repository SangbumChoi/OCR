# One-seed screening pilot for the LFM language-operator transfer experiment.
# This configuration is intentionally non-promotional. Use the paired three-seed
# sweep for confirmatory evidence.

schema_version: 1
name: docvlm-lfm-language-transfer-pilot
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-lfm-language-transfer-pilot
baseline: lfm_random

shared_experiment_patches:
  - {op: add, path: /initialization/language_family, value: lfm2}
  - op: replace
    path: /initialization/language_source
    value:
      hub:
        repo_id: LiquidAI/LFM2.5-VL-1.6B
        revision: 919fde3d022e3f90a4716006f993938ee8c2eb97
  - {op: replace, path: /runtime/visual_backend_benchmark/enabled, value: false}
  - {op: replace, path: /runtime/training_feasibility_benchmark/enabled, value: false}
  - {op: replace, path: /synthetic/count, value: 32}
  - {op: replace, path: /synthetic/validation_count, value: 8}
  - {op: replace, path: /synthetic/heldout_count, value: 32}
  - {op: replace, path: /synthetic/adaptation_policy/enabled, value: false}
  - {op: replace, path: /data/components/1/hub/max_rows, value: 256}
  - {op: replace, path: /sequence_teacher/max_requests, value: 128}
  - {op: replace, path: /sequence_teacher/accepted_target_count, value: 12}
  - {op: replace, path: /pretraining/max_steps, value: 25}
  - {op: replace, path: /pretraining/batch_size, value: 1}
  - {op: replace, path: /pretraining/num_workers, value: 2}
  - {op: replace, path: /posttraining/sft/max_steps, value: 10}
  - {op: replace, path: /posttraining/sft/num_workers, value: 2}
  - {op: replace, path: /posttraining/rlvr/max_steps, value: 5}
  - {op: replace, path: /evaluation/max_samples, value: 64}
  - {op: replace, path: /evaluation/temperature_calibration/enabled, value: false}
  - {op: add, path: /evaluation/wandb_tags/-, value: lfm-language-transfer-pilot}
  - {op: add, path: /evaluation/wandb_tags/-, value: screening-only}

matched_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /initialization/language_family}
  - {document: experiment, path: /initialization/language_source}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /data/components}
  - {document: experiment, path: /sequence_teacher/max_requests}
  - {document: experiment, path: /pretraining/max_steps}
  - {document: experiment, path: /posttraining/sft/max_steps}
  - {document: experiment, path: /posttraining/rlvr/max_steps}
  - {document: experiment, path: /evaluation/max_samples}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}

replicate_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}

replicates:
  - id: seed_0
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 5}
      - {op: replace, path: /synthetic/train_seed, value: 7}
      - {op: replace, path: /synthetic/heldout_seed, value: 7007}
      - {op: replace, path: /evaluation/seed, value: 31}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 7}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 7}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 17}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 23}

variants:
  - id: native_random
    hypothesis: "Screens the native all-attention operator from random initialization."
    decision_metrics: {language_width: 1536, language_layers: 23, expected_transfer_groups: 0}
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I0_random}

  - id: lfm_random
    hypothesis: "Screens the LFM-aligned hybrid operator without inherited language weights."
    decision_metrics: {language_width: 2048, language_layers: 12, expected_transfer_groups: 0}
    blueprint_patches: &lfm_geometry
      - {op: replace, path: /tokenizer/vocab_size, value: 65536}
      - {op: replace, path: /student/language/vocab_size, value: 65536}
      - {op: replace, path: /student/language/width, value: 2048}
      - {op: replace, path: /student/language/layers, value: 12}
      - {op: replace, path: /student/language/attention_heads, value: 32}
      - {op: replace, path: /student/language/kv_heads, value: 8}
      - {op: replace, path: /student/language/mlp_width, value: 5120}
      - {op: replace, path: /student/language/rope_base, value: 1000000.0}
      - {op: replace, path: /student/language/rope_layout, value: half_split}
      - {op: replace, path: /student/language/norm_eps, value: 0.00001}
      - {op: replace, path: /student/language/qk_norm, value: true}
      - {op: replace, path: /student/language/attention_bias, value: false}
      - {op: replace, path: /student/language/mlp_bias, value: false}
      - {op: replace, path: /student/language/full_attention_layers, value: [2, 5, 8, 10]}
      - {op: replace, path: /student/language/conv_kernel_size, value: 3}
      - {op: replace, path: /student/language/conv_bias, value: false}
      - {op: replace, path: /student/connector/output_width, value: 2048}
      - {op: replace, path: /student/connector/layers, value: 1}
      - {op: replace, path: /student/connector/attention_heads, value: 16}
      - {op: replace, path: /student/connector/mlp_width, value: 4096}
      - op: replace
        path: /training/pretraining/distillation/language_layer_pairs
        value: [[2, 2], [5, 5], [8, 8], [11, 11]]

  - id: lfm_strict_transfer
    hypothesis: "Screens strict LFM transfer under the aligned operator."
    decision_metrics: {language_width: 2048, language_layers: 12, expected_transfer_groups: 3}
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I8_lfm_aligned_language}
      - {op: replace, path: /runtime/training_feasibility_benchmark/enabled, value: true}
    blueprint_patches: *lfm_geometry

contrasts:
  - id: geometry_effect_without_transfer
    hypothesis: "Screens the LFM-aligned operator effect under random initialization."
    coefficients: {native_random: -1, lfm_random: 1}
  - id: transfer_effect_lfm_geometry
    hypothesis: "Screens strict LFM transfer against its aligned random control."
    coefficients: {lfm_random: -1, lfm_strict_transfer: 1}

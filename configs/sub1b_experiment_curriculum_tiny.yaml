# CPU smoke test for two or more attested failure-driven curriculum rounds.

schema_version: 1
name: docvlm-tiny-curriculum
blueprint: configs/sub1b_architecture.yaml
output_root: outputs/docvlm-tiny-curriculum

runtime:
  device: cpu
  visual_backend_benchmark:
    enabled: false
  training_feasibility_benchmark:
    enabled: false

synthetic:
  enabled: true
  config: configs/synth_data.yaml
  cases: [hard_table]
  count: 1
  train_count: null
  validation_count: 1
  heldout_count: null
  difficulty_level: 2
  train_seed: 17
  validation_seed: 1707
  heldout_seed: 17017
  no_degrade: true
  variant: clean
  training_policy_plan: null
  adaptation_policy:
    enabled: true
    config: configs/sub1b_synthesis_policy.yaml
    budget: 1
    seed: 91

data:
  components:
    - name: synthetic_documents
      path: "@synthetic"
      weight: 1.0

sequence_teacher:
  enabled: true
  model: dummy-echo
  revision: null
  predictions: null
  device: cpu
  dtype: float32
  max_new_tokens: 16
  temperature: 0.0
  min_score: 0.8
  min_acceptance_rate: 0.0
  max_requests: 4
  accepted_target_count: null
  selection_seed: 7
  target_probability: 0.5
  target_format: answer
  seed: 7

tokenizer:
  vocab_size: 512
  min_frequency: 1
  include_teacher_targets: false
  no_progress: true

initialization:
  arm: I0_random
  seed: 5
  device: cpu
  allow_full_memory: false
  tiny: true

continuation:
  enabled: false

pretraining:
  max_steps: 1
  batch_size: 1
  num_workers: 0
  eval_group_by: component
  no_grounding: false

posttraining:
  sft:
    max_steps: 1
    num_workers: 0
    target_mode: evidence_linked
  preference:
    enabled: false
    max_steps: null
  rlvr:
    enabled: true
    max_steps: 1
    replay_every_steps: 1
    replay_loss_coefficient: 0.10
    replay_samples: null

evaluation:
  max_new_tokens: 8
  max_samples: 1
  use_kv_cache: true
  precision: float32
  seed: 31
  temperature_calibration:
    enabled: false
    source_split: heldout
    fraction: 0.2
    min_samples: 20
    correct_threshold: 0.5
    min_temperature: 0.05
    max_temperature: 20.0
    seed: 47
  wandb_project: null
  wandb_tags: [native-student, curriculum-smoke]
  baseline_evaluation: null
  monolingual_control_evaluation: null

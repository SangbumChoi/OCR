      - {op: replace, path: /training/posttraining/preference/optimizer/seed, value: 223}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 223}

variants:
  - id: grpo
    hypothesis: "Tests on-policy verifier optimization with group-standardized advantages."

  - id: dpo
    hypothesis: "Tests offline preference learning from verifier-ranked frozen-reference candidates."
    experiment_patches:
      - {op: replace, path: /posttraining/preference/enabled, value: true}
      - {op: replace, path: /posttraining/rlvr/enabled, value: false}

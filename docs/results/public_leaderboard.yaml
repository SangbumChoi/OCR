      faithfully also fails). Every model got the same 200-DPI rendering of each PDF. The official
      scorer drops a model's whole score if one test raises; the table parser raises on overlapping
      rowspans, so those tests were counted as failed instead (row notes). Published card numbers
      (rendering and settings not disclosed): PaddleOCR-VL 77.7 · DeepSeek-OCR 76.7 · olmOCR v0.2.0
      76.3 · GLM-OCR 61.7.

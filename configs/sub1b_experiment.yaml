# End-to-end executable experiment for the native sub-1B document VLM.
# Inspect the complete DAG without changing files:
#   python scripts/run_student_experiment.py --dry-run

schema_version: 1
name: docvlm-800m-hard
blueprint: configs/sub1b_architecture.yaml
output_root: outputs/docvlm-800m-hard

runtime:
  device: auto

synthetic:
  enabled: true
  config: configs/synth_data.yaml
  cases: [hard_table, hard_chart, hard_investment, hard_science]
  count: 100
  difficulty_level: 5
  train_seed: 7
  heldout_seed: 7007
  no_degrade: false
  variant: degraded

data:
  # Add public components as additional NAME/path/weight entries. Weights must sum to 1.
  # A component can set fold: train when its on-disk UDD dataset contains a fold column.
  components:
    - name: synthetic_documents
      path: "@synthetic"
      weight: 0.45
    - name: public_udd
      weight: 0.55
      hub:
        repo_id: danelcsb/UDD
        revision: f5eb52104627d20ddd1eab2130ad78f87cb0d7c9
        split: train
        fold: train
        sources: []
        tasks: []
        languages: []
        max_rows: null
        seed: 7
        decode_checks: 32

sequence_teacher:
  enabled: true
  model: lfm2_5-vl-1.6b
  predictions: null
  device: cuda
  dtype: bfloat16
  max_new_tokens: 128
  temperature: 0.0
  min_score: 0.8
  min_acceptance_rate: 0.1
  target_probability: 0.5
  target_format: answer
  seed: 7

tokenizer:
  vocab_size: null
  min_frequency: 2
  no_progress: true

initialization:
  arm: I0_random
  seed: 5
  device: cpu
  allow_full_memory: true
  tiny: false
  vision_source: null
  language_source: null
  token_map: null

pretraining:
  teacher_checkpoint: null
  epochs: null
  max_steps: null
  batch_size: null
  num_workers: null
  eval_group_by: component
  no_grounding: false

posttraining:
  sft:
    max_steps: null
    num_workers: null
    target_mode: evidence_linked
  rlvr:
    max_steps: null
    replay_every_steps: null
    replay_loss_coefficient: null
    replay_samples: null

evaluation:
  max_new_tokens: 128
  max_samples: null
  precision: bfloat16
  seed: 31
  wandb_project: null
  wandb_entity: null
  wandb_run: null
  wandb_group: null
  wandb_tags: [native-student, hard-documents]

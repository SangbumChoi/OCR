# GRPO-standardized versus RLOO advantages by three paired replicates.

schema_version: 1
name: docvlm-rlvr-advantage-ablation
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-rlvr-advantage-ablation
baseline: group_standardized

shared_experiment_patches:
  - {op: add, path: /evaluation/wandb_tags/-, value: posttraining-ablation}
  - {op: add, path: /evaluation/wandb_tags/-, value: rlvr-advantage-ablation}

shared_blueprint_patches:
  - {op: replace, path: /training/posttraining/rlvr/optimizer/max_steps, value: null}
  - {op: replace, path: /training/posttraining/rlvr/optimizer/total_student_flops, value: 192000000000000000}
  - {op: replace, path: /training/posttraining/rlvr/optimizer/stop_at_student_flops, value: true}

matched_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/count}
  - {document: experiment, path: /synthetic/train_count}
  - {document: experiment, path: /synthetic/heldout_count}
  - {document: experiment, path: /synthetic/train_seed}

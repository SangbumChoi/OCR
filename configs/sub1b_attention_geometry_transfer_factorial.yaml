# Native versus Qwen-aligned attention geometry crossed with strict structured transfer.

schema_version: 1
name: docvlm-attention-geometry-transfer-factorial
base_experiment: configs/sub1b_experiment.yaml
output_root: outputs/sweeps/docvlm-attention-geometry-transfer-factorial
baseline: native_random

shared_experiment_patches:
  - {op: add, path: /initialization/vision_family, value: siglip}
  - {op: add, path: /initialization/language_family, value: llama}
  - op: replace
    path: /initialization/vision_source
    value:
      hub:
        repo_id: google/siglip-base-patch16-224
        revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
  - op: replace
    path: /initialization/language_source
    value:
      hub:
        repo_id: Qwen/Qwen2.5-1.5B
        revision: 8faed761d45a263340a0528343f099c05c9a4323
  - {op: add, path: /evaluation/wandb_tags/-, value: attention-geometry-transfer-factorial}
  - {op: add, path: /evaluation/wandb_tags/-, value: same-pinned-initialization-sources}

matched_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /initialization/vision_family}
  - {document: experiment, path: /initialization/language_family}
  - {document: experiment, path: /initialization/vision_source}
  - {document: experiment, path: /initialization/language_source}
  - {document: experiment, path: /synthetic/count}
  - {document: experiment, path: /synthetic/train_count}
  - {document: experiment, path: /synthetic/heldout_count}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /data/components}
  - {document: experiment, path: /data/components/1/hub/seed}
  - {document: experiment, path: /pretraining/max_steps}
  - {document: experiment, path: /posttraining/sft/max_steps}
  - {document: experiment, path: /posttraining/rlvr/max_steps}
  - {document: experiment, path: /evaluation/max_samples}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}
  - {document: blueprint, path: /training/pretraining/optimizer/total_tokens}
  - {document: blueprint, path: /training/pretraining/optimizer/epochs}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/total_tokens}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/max_steps}

replicate_controls:
  - {document: experiment, path: /initialization/seed}
  - {document: experiment, path: /synthetic/train_seed}
  - {document: experiment, path: /synthetic/heldout_seed}
  - {document: experiment, path: /data/components/1/hub/seed}
  - {document: experiment, path: /evaluation/seed}
  - {document: blueprint, path: /training/pretraining/input_pipeline/augmentation_seed}
  - {document: blueprint, path: /training/pretraining/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/sft/optimizer/seed}
  - {document: blueprint, path: /training/posttraining/rlvr/optimizer/seed}

replicates:
  - id: seed_0
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 5}
      - {op: replace, path: /synthetic/train_seed, value: 7}
      - {op: replace, path: /synthetic/heldout_seed, value: 7007}
      - {op: replace, path: /data/components/1/hub/seed, value: 7}
      - {op: replace, path: /evaluation/seed, value: 31}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 7}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 7}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 17}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 23}

  - id: seed_1
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 105}
      - {op: replace, path: /synthetic/train_seed, value: 107}
      - {op: replace, path: /synthetic/heldout_seed, value: 7107}
      - {op: replace, path: /data/components/1/hub/seed, value: 107}
      - {op: replace, path: /evaluation/seed, value: 131}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 107}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 107}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 117}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 123}

  - id: seed_2
    experiment_patches:
      - {op: replace, path: /initialization/seed, value: 205}
      - {op: replace, path: /synthetic/train_seed, value: 207}
      - {op: replace, path: /synthetic/heldout_seed, value: 7207}
      - {op: replace, path: /data/components/1/hub/seed, value: 207}
      - {op: replace, path: /evaluation/seed, value: 231}
    blueprint_patches:
      - {op: replace, path: /training/pretraining/input_pipeline/augmentation_seed, value: 207}
      - {op: replace, path: /training/pretraining/optimizer/seed, value: 207}
      - {op: replace, path: /training/posttraining/sft/optimizer/seed, value: 217}
      - {op: replace, path: /training/posttraining/rlvr/optimizer/seed, value: 223}

variants:
  - id: native_random
    hypothesis: "Measures the native 24/8 attention geometry without inherited weights."
    decision_metrics: {head_dim: 64, kv_width: 512, rope_base: 10000}

  - id: qwen_random
    hypothesis: "Measures Qwen-aligned 12/2 attention geometry without inherited weights."
    decision_metrics: {head_dim: 128, kv_width: 256, rope_base: 1000000}
    blueprint_patches: &qwen_geometry
      - {op: replace, path: /student/language/attention_heads, value: 12}
      - {op: replace, path: /student/language/kv_heads, value: 2}
      - {op: replace, path: /student/language/rope_base, value: 1000000.0}

  - id: native_strict_transfer
    hypothesis: "Measures strict structured transfer under the native attention geometry."
    decision_metrics: {head_dim: 64, kv_width: 512, rope_base: 10000}
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I6_strict_structured}

  - id: qwen_strict_transfer
    hypothesis: "Measures strict structured transfer under source-aligned attention geometry."
    decision_metrics: {head_dim: 128, kv_width: 256, rope_base: 1000000}
    experiment_patches:
      - {op: replace, path: /initialization/arm, value: I6_strict_structured}
    blueprint_patches: *qwen_geometry

contrasts:
  - id: geometry_effect_without_transfer
    hypothesis: "Effect of source-aligned geometry under random initialization."
    coefficients: {native_random: -1, qwen_random: 1}
  - id: geometry_effect_with_transfer
    hypothesis: "Effect of source-aligned geometry under strict structured transfer."
    coefficients: {native_strict_transfer: -1, qwen_strict_transfer: 1}
  - id: transfer_effect_native_geometry
    hypothesis: "Strict structured-transfer effect under native geometry."
    coefficients: {native_random: -1, native_strict_transfer: 1}
  - id: transfer_effect_qwen_geometry
    hypothesis: "Strict structured-transfer effect under source-aligned geometry."
    coefficients: {qwen_random: -1, qwen_strict_transfer: 1}
  - id: geometry_x_transfer
    hypothesis: "Difference-in-differences: whether source alignment specifically increases transfer benefit."
    coefficients:
      native_random: 1
      qwen_random: -1
      native_strict_transfer: -1
      qwen_strict_transfer: 1

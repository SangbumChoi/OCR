# Document-understanding benchmark CATALOG.
#
# Every benchmark used across the capability families A–F (docs/report/benchmark_taxonomy.md),
# each annotated with `purpose` = what it actually tries to measure. Entries with an `hf_id`
# are fetched as a one-sample preview by scripts/fetch_benchmark_samples.py (HF streaming);
# entries with `hf_id: null` are documented-only (not cleanly streamable from HF — script-based
# loader, gated, or eval-server) and are realised illustratively where it matters
# (scripts/make_synthetic_samples.py for recognition_fullpage / scenetext / robustness).

benchmarks:

  # ---------- A1. Full-page / printed & handwritten text recognition ----------
  - {key: iam, name: IAM-line, category: "A1. Text recognition", metric: "CER / WER / NED",
     purpose: "Recognize handwritten English text lines; the classic handwriting-recognition fidelity test.",
     hf_id: Teklia/IAM-line, config: null, split: test, source: "https://fki.tic.heia-fr.ch/databases/iam-handwriting-database"}
  - {key: recognition_fullpage, kind: synthetic, name: "Printed full-page (illustrative)", category: "A1. Text recognition",
     metric: "CER / WER / NED", purpose: "Transcribe a full printed page exactly; measures end-to-end OCR fidelity / typo rate.",
     hf_id: null, config: null, split: null, source: "synthetic (scripts/make_synthetic_samples.py)"}
  - {key: iiit5k, name: IIIT5K, category: "A1. Text recognition", metric: "word accuracy / 1-NED",
     purpose: "Cropped-word recognition; isolates pure recognition from detection.",
     hf_id: null, config: null, split: null, source: "https://cvit.iiit.ac.in/research/projects/cvit-projects/the-iiit-5k-word-dataset"}
  - {key: synthdog_en, name: SynthDoG-EN, category: "A1. Text recognition (synthetic)", metric: "CER / NED",
     purpose: "Synthetic full-page English reading (Donut's pretraining recipe); scale recognition data.",
     hf_id: naver-clova-ix/synthdog-en, config: null, split: train, source: "https://arxiv.org/abs/2111.15664"}
  - {key: synthdog_ko, name: SynthDoG-KO, category: "A1. Text recognition (synthetic)", metric: "CER / NED",
     purpose: "Synthetic full-page Korean reading; real ko recognition rows for the A4 ko/en ablation.",
     hf_id: naver-clova-ix/synthdog-ko, config: null, split: train, source: "https://arxiv.org/abs/2111.15664"}

  # ---------- A2. Scene-text detection & recognition ----------
  - {key: scenetext, kind: synthetic, name: "Scene text (illustrative)", category: "A2. Scene-text", metric: "H-mean / word-acc / 1-NED",
     purpose: "Detect + read text 'in the wild' (signs, products); irregular fonts/orientations.",
     hf_id: null, config: null, split: null, source: "synthetic (scripts/make_synthetic_samples.py)"}
  - {key: icdar2015, name: ICDAR-2015 (Incidental Scene Text), category: "A2. Scene-text", metric: "detection H-mean",
     purpose: "Detect/recognize incidental scene text under blur/perspective; standard detection F-measure.",
     hf_id: null, config: null, split: null, source: "https://rrc.cvc.uab.es/?ch=4"}
  - {key: totaltext, name: Total-Text, category: "A2. Scene-text", metric: "detection H-mean",
     purpose: "Curved/multi-oriented scene text; stresses non-horizontal layouts.",
     hf_id: null, config: null, split: null, source: "https://github.com/cs-chan/Total-Text-Dataset"}

  # ---------- B1. Document / scene-text / diagram VQA ----------
  - {key: docvqa, name: DocVQA, category: "B1. Document VQA", metric: anls,
     purpose: "Answer questions about scanned business documents; reading + layout + key-value extraction.",
     hf_id: lmms-lab/DocVQA, config: DocVQA, split: validation, source: "https://arxiv.org/abs/2007.00398"}
  - {key: infovqa, name: InfographicVQA, category: "B1. Document VQA", metric: anls,
     purpose: "QA over infographics; joint layout + graphics + text + basic arithmetic reasoning.",
     hf_id: lmms-lab/DocVQA, config: InfographicVQA, split: validation, source: "https://arxiv.org/abs/2104.12756"}
  - {key: textvqa, name: TextVQA, category: "B1. Scene-text VQA", metric: exact,
     purpose: "Answer questions that require reading text in natural images.",
     hf_id: lmms-lab/textvqa, config: null, split: validation, source: "https://arxiv.org/abs/1904.08920"}
  - {key: stvqa, name: ST-VQA, category: "B1. Scene-text VQA", metric: anls,
     purpose: "VQA requiring reading scene text; origin of the ANLS metric.",
     hf_id: HuggingFaceM4/the_cauldron, config: st_vqa, split: train, source: "https://arxiv.org/abs/1905.13648"}
  - {key: mtvqa, name: MTVQA, category: "B1. Multilingual document VQA", metric: anls,
     purpose: "Document VQA across 9 non-English languages (incl. ko/ja/ar); real-data multilingual check.",
     hf_id: ByteDance/MTVQA, config: null, split: train, source: "https://arxiv.org/abs/2405.11985"}
  - {key: screenqa, name: RICO-ScreenQA, category: "B1. UI/screen VQA", metric: anls,
     purpose: "QA over mobile-app screenshots with answer UI-element boxes; public counterpart to webui_probe.",
     hf_id: rootsautomation/RICO-ScreenQA, config: null, split: train, source: "https://arxiv.org/abs/2209.08199"}
  - {key: docmatix, name: Docmatix, category: "B1. Document VQA (large-scale train)", metric: anls,
     purpose: "2.4M-image / 9.5M-QA document-VQA training corpus (IDL-derived); the A0 scale-sweep source.",
     hf_id: HuggingFaceM4/Docmatix, config: images, split: train, source: "https://huggingface.co/datasets/HuggingFaceM4/Docmatix"}
  - {key: ocrvqa, name: OCR-VQA, category: "B1. Document VQA", metric: exact,
     purpose: "QA over book-cover images; reading titles/authors/edition from text-heavy images.",
     hf_id: howard-hou/OCR-VQA, config: null, split: test, source: "https://ocr-vqa.github.io/"}
  - {key: ai2d, name: AI2D, category: "B1. Diagram QA", metric: exact,
     purpose: "Multiple-choice QA over grade-school science diagrams; arrows/labels/structure reasoning.",
     hf_id: lmms-lab/ai2d, config: null, split: test, source: "https://allenai.org/data/diagrams"}
  - {key: visualmrc, name: VisualMRC, category: "B1. Document VQA (abstractive)", metric: "BLEU/METEOR/CIDEr",
     purpose: "Long abstractive answers over webpage screenshots; reading comprehension + generation.",
     hf_id: HuggingFaceM4/the_cauldron, config: visualmrc, split: train, source: "https://arxiv.org/abs/2101.11272"}

  # ---------- B2. Key Information Extraction (KIE) ----------
  - {key: funsd, name: FUNSD, category: "B2. Key Information Extraction (forms)", metric: "entity F1",
     purpose: "Extract entities (question/answer/header) AND key->value links from noisy scanned forms.",
     hf_id: nielsr/funsd-layoutlmv3, config: null, split: test, source: "https://arxiv.org/abs/1905.13538"}
  - {key: cord, name: CORD, category: "B2. Key Information Extraction (receipts)", metric: "entity F1",
     purpose: "Extract ~30 fine-grained fields + hierarchy from receipts.",
     hf_id: naver-clova-ix/cord-v2, config: null, split: test, source: "https://github.com/clovaai/cord"}
  - {key: sroie, name: SROIE, category: "B2. Key Information Extraction (receipts)", metric: "field F1",
     purpose: "Extract 4 fields (company/date/address/total) from receipts; exact field match.",
     hf_id: priyank-m/SROIE_2019_text_recognition, config: null, split: train, source: "https://rrc.cvc.uab.es/?ch=13"}
  - {key: docile, name: DocILE, category: "B2. Key Information Extraction (invoices)", metric: "F1 / AP",
     purpose: "Localize+extract key info (KILE) and line items (LIR) from business documents; 55 field types.",
     hf_id: null, config: null, split: null, source: "https://docile.rossum.ai/"}
  - {key: xfund, name: XFUND, category: "B2. Key Information Extraction (multilingual forms)", metric: "entity / relation F1",
     purpose: "Multilingual (7 languages) form understanding; entity + relation extraction.",
     hf_id: null, config: null, split: null, source: "https://github.com/doc-analysis/XFUND"}
  - {key: wildreceipt, name: WildReceipt, category: "B2. Key Information Extraction (receipts)", metric: "entity F1",
     purpose: "26-key receipt KIE in realistic photos; harder capture conditions than SROIE.",
     hf_id: null, config: null, split: null, source: "https://download.openmmlab.com/mmocr/data/wildreceipt.tar"}

  # ---------- C1. Table recognition & structure ----------
  - {key: pubtabnet, name: PubTabNet, category: "C1. Table recognition", metric: "TEDS / TEDS-S",
     purpose: "Reconstruct table structure + cell content (HTML) from images; cell-relationship fidelity.",
     hf_id: apoidea/pubtabnet-html, config: null, split: validation, source: "https://github.com/ibm-aur-nlp/PubTabNet"}
  - {key: pubtables1m, name: PubTables-1M, category: "C1. Table recognition + detection", metric: "GriTS / mAP",
     purpose: "Large-scale table detection + structure recognition; GriTS over cell grids (topology).",
     hf_id: bsmock/pubtables-1m, config: null, split: train, source: "https://github.com/microsoft/table-transformer"}
  - {key: fintabnet, name: FinTabNet, category: "C1. Table recognition (financial)", metric: "TEDS",
     purpose: "Complex financial tables (merged cells, dense numerics); structure + content extraction.",
     hf_id: null, config: null, split: null, source: "https://developer.ibm.com/data/fintabnet/"}
  - {key: scitsr, name: SciTSR, category: "C1. Table structure recognition", metric: "cell-adjacency F1",
     purpose: "Table structure from scientific papers; neighbour-relationship correctness.",
     hf_id: null, config: null, split: null, source: "https://github.com/Academic-Hammer/SciTSR"}

  # ---------- B3. Chart / plot understanding ----------
  - {key: chartqa, name: ChartQA, category: "B3. Chart understanding", metric: relaxed_acc,
     purpose: "Read + reason (compare/arithmetic) over bar/line/pie charts; relaxed numeric accuracy.",
     hf_id: lmms-lab/ChartQA, config: null, split: test, source: "https://arxiv.org/abs/2203.10244"}
  - {key: mathvista, name: MathVista, category: "B3. Chart/figure math reasoning", metric: exact,
     purpose: "Visual mathematical reasoning over figures/plots/diagrams; multi-step quantitative reasoning.",
     hf_id: AI4Math/MathVista, config: null, split: testmini, source: "https://arxiv.org/abs/2310.02255"}
  - {key: plotqa, name: PlotQA, category: "B3. Chart understanding", metric: relaxed_acc,
     purpose: "QA over scientific plots with out-of-vocabulary numeric answers; data extraction + reasoning.",
     hf_id: HuggingFaceM4/the_cauldron, config: plotqa, split: train, source: "https://arxiv.org/abs/1909.00997"}
  - {key: dvqa, name: DVQA, category: "B3. Chart understanding", metric: exact,
     purpose: "Bar-chart QA testing structure/element reading and value comparison.",
     hf_id: HuggingFaceM4/the_cauldron, config: dvqa, split: train, source: "https://arxiv.org/abs/1801.08163"}
  - {key: tatqa, name: TAT-QA, category: "B3. Financial numeric reasoning", metric: exact,
     purpose: "Numeric reasoning over financial tables+text; public counterpart to the H-accounting probe.",
     hf_id: HuggingFaceM4/the_cauldron, config: tat_qa, split: train, source: "https://arxiv.org/abs/2105.07624"}

  # ---------- C2. Formula / math-expression recognition ----------
  - {key: im2latex, name: im2latex (latex-formulas), category: "C2. Formula recognition", metric: "edit dist / BLEU",
     purpose: "Image -> LaTeX for printed formulas; token accuracy / normalized edit distance.",
     hf_id: OleehyO/latex-formulas, config: cleaned_formulas, split: train, source: "https://github.com/OleehyO/TexTeller"}
  - {key: latexocr, name: LaTeX_OCR, category: "C2. Formula recognition", metric: "edit dist / BLEU / exact",
     purpose: "Image -> LaTeX rendering; exact-match + edit-distance on the token sequence.",
     hf_id: linxy/LaTeX_OCR, config: default, split: train, source: "https://huggingface.co/datasets/linxy/LaTeX_OCR"}
  - {key: crohme, name: CROHME, category: "C2. Formula recognition (handwritten)", metric: "expression rec. rate",
     purpose: "Handwritten math expression recognition; expression-level + symbol-level accuracy.",
     hf_id: null, config: null, split: null, source: "https://www.isical.ac.in/~crohme/"}

  # ---------- D1. Comprehensive LMM OCR / figure suites ----------
  - {key: ocrbench, name: OCRBench, category: "D1. LMM OCR suite", metric: ocrbench,
     purpose: "1000-item OCR capability probe across 5 sub-skills (recog / scene-VQA / doc-VQA / KIE / HME).",
     hf_id: echo840/OCRBench, config: null, split: test, source: "https://arxiv.org/abs/2305.07895"}
  - {key: ocrbench_v2, name: OCRBench v2, category: "D1. LMM OCR suite", metric: "per-task acc",
     purpose: "Extended OCR suite (~10k items, 31 scenarios) incl. fine-grained spotting & structure.",
     hf_id: ling99/OCRBench_v2, config: null, split: test, source: "https://github.com/Yuliang-Liu/MultimodalOCR"}
  - {key: charxiv, name: CharXiv, category: "D1. Scientific-figure reasoning", metric: "descriptive/reasoning acc",
     purpose: "Realistic scientific-figure understanding (arXiv charts); descriptive + reasoning questions.",
     hf_id: princeton-nlp/CharXiv, config: null, split: validation, source: "https://arxiv.org/abs/2406.18521"}
  - {key: seedbench2plus, name: SEED-Bench-2-Plus, category: "D1. Text-rich image suite", metric: "accuracy",
     purpose: "MCQ over text-rich images (charts/maps/webs); broad text-comprehension coverage.",
     hf_id: null, config: null, split: null, source: "https://arxiv.org/abs/2404.16790"}

  # ---------- A3. End-to-end page parsing & layout ----------
  - {key: omnidocbench, name: OmniDocBench, category: "A3. End-to-end parsing", metric: "edit dist / TEDS / CDM",
     purpose: "Whole-page -> structured output across text/formula/table/reading-order; per-element scoring.",
     hf_id: opendatalab/OmniDocBench, config: null, split: train, source: "https://arxiv.org/abs/2412.07626"}
  - {key: doclaynet, name: DocLayNet, category: "A3. Layout analysis", metric: "COCO mAP",
     purpose: "Document layout detection (11 classes) across 6 doc types; element localization.",
     hf_id: ds4sd/DocLayNet-v1.1, config: null, split: train, source: "https://arxiv.org/abs/2206.01062"}
  - {key: publaynet, name: PubLayNet, category: "A3. Layout analysis", metric: "COCO mAP",
     purpose: "360k-page layout detection (5 classes) on PubMed pages; large-scale localization complement to DocLayNet.",
     hf_id: jordanparker6/publaynet, config: null, split: train, source: "https://arxiv.org/abs/1908.07836"}
  - {key: rvl_cdip, name: RVL-CDIP, category: "A3. Document classification", metric: "accuracy",
     purpose: "16-class document-type classification (letter/invoice/resume/...); activates the classification task.",
     hf_id: chainyo/rvl-cdip, config: null, split: train, source: "https://arxiv.org/abs/1502.07058"}
  - {key: fox, name: Fox, category: "A3. Fine-grained region parsing", metric: "edit dist / F1",
     purpose: "Region/colour-guided OCR + cross-page understanding on dense multi-page docs.",
     hf_id: null, config: null, split: null, source: "https://arxiv.org/abs/2405.14295"}
  - {key: readoc, name: READoc, category: "A3. PDF->Markdown conversion", metric: "edit-sim / TEDS",
     purpose: "Holistic PDF -> semantic Markdown (text/headings/tables/reading-order).",
     hf_id: null, config: null, split: null, source: "https://arxiv.org/abs/2409.05137"}

  # ---------- E1. Reliability: robustness / calibration / hallucination ----------
  - {key: robustness, kind: synthetic, name: "Robustness probe (derived)", category: "E1. Reliability", metric: "ANLS retention + ECE",
     purpose: "Stability under capture degradations + terminology paraphrase; confidence calibration.",
     hf_id: null, config: null, split: null, source: "derived from DocVQA (scripts/make_synthetic_samples.py / build_robustness_set.py)"}
  - {key: pope, name: POPE, category: "E1. Hallucination", metric: "F1 / accuracy",
     purpose: "Object-existence polling (yes/no) to quantify hallucination; precision/recall/F1.",
     hf_id: lmms-lab/POPE, config: null, split: test, source: "https://arxiv.org/abs/2305.10355"}
  - {key: hallusionbench, name: HallusionBench, category: "E1. Hallucination", metric: "acc + consistency",
     purpose: "Visual-illusion vs knowledge-hallucination yes/no pairs; consistency-aware scoring.",
     hf_id: lmms-lab/HallusionBench, config: null, split: image, source: "https://arxiv.org/abs/2310.14566"}
  - {key: kie_hvqa, name: KIE-HVQA, category: "E1. OCR hallucination", metric: "hallucination-free acc",
     purpose: "Penalize confident wrong field values on degraded ID/invoice docs; reward correct-or-abstain.",
     hf_id: null, config: null, split: null, source: "https://arxiv.org/abs/2506.20168"}

  # ---------- F1. Custom capability axes (our probe; rendered, exact GT incl. boxes) ----------
  - {key: capability_probe, kind: probe, name: "Custom capability probe", category: "F1. Custom capability axes",
     metric: "anls / relaxed_acc / exact / grounding",
     purpose: "Isolate the document-VLM capability axes on controlled renders: text recognition,
               localized KIE, integrative reasoning (sum & relations), chart reading, and spatial
               grounding (bounding box) — built by scripts/make_capability_probe.py with exact GT.",
     hf_id: null, config: null, split: null,
     source: "SYNTHETIC (scripts/make_capability_probe.py)"}
  - {key: custom_eval, kind: probe, name: "Proposed custom evaluation set", category: "F1. Custom capability axes",
     metric: "ned / teds / exact / relaxed_acc / grounding",
     purpose: "Our proposed real-world eval format: per content-class (text/table/formula/chart/
               qr/barcode/stamp/logo), per-language (en/ko/ja/zh), rotation robustness (0/15/90/180/
               270), reading-direction (vertical CJK), and spotting (basis-of-extraction), each scored
               with a class-appropriate metric. See data/probes/custom_eval/README.md.",
     hf_id: null, config: null, split: null,
     source: "SYNTHETIC (scripts/make_custom_eval.py)"}
  - {key: oov_probe, kind: probe, name: "Out-of-vocabulary script probe", category: "F1. Custom capability axes",
     metric: "ned / exact",
     purpose: "Un-tokenizable glyphs (invented / runic / 7-segment): measure the FALLBACK pattern
               (abstain / transliterate / hallucinate / copy) and whether an in-image legend enables
               decoding by in-context visual reasoning.",
     hf_id: null, config: null, split: null, source: "SYNTHETIC (scripts/make_oov_probe.py)"}
  - {key: webui_probe, kind: probe, name: "Web UI/UX (agent) probe", category: "F1. Custom capability axes",
     metric: "grounding / exact / ned",
     purpose: "Web-agent UI understanding: locate interactive elements (button/search/cart), identify
               the primary CTA, read the nav, and reason about affordances (what to click to act).",
     hf_id: null, config: null, split: null, source: "SYNTHETIC (scripts/make_webui_probe.py)"}
  - {key: spatial_context_probe, kind: probe, name: "Spatial/context falsifiable probe", category: "F1. Custom capability axes",
     metric: "exact / ned / grounding",
     purpose: "Control-paired probes (counterfactual / distractor / position-bias / absence) that
               defeat shortcut guessing — does the model read the pixels, and abstain when it can't?",
     hf_id: null, config: null, split: null, source: "SYNTHETIC (scripts/make_spatial_context_probe.py)"}
  - {key: realistic_cases, kind: probe, name: "Realistic document special cases", category: "F1. Custom capability axes",
     metric: "ned / teds / exact / grounding / abstain",
     purpose: "Realistic-looking document types (ID/cheque/prescription/redacted/webtoon/ancient/LCD/
               website/mobile/PDF) rendered with built-in GT (HTML/CSS->WeasyPrint->PyMuPDF boxes->
               Augraphy), paired clean/degraded. See data/probes/realistic_cases/README.md.",
     hf_id: null, config: null, split: null, source: "SYNTHETIC (scripts/make_realistic_cases.py)"}

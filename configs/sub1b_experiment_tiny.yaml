# CPU smoke test for the complete native-student experiment DAG.
# This uses the same stage contracts as the full experiment with one tiny model and one step.

schema_version: 1
name: docvlm-tiny-smoke
blueprint: configs/sub1b_architecture.yaml
output_root: outputs/docvlm-tiny-smoke

runtime:
  device: cpu

synthetic:
  enabled: true
  config: configs/synth_data.yaml
  cases: [hard_table]
  count: 1
  train_count: null
  heldout_count: null
  difficulty_level: 2
  train_seed: 17
  heldout_seed: 17017
  no_degrade: true
  variant: clean

data:
  components:
    - name: synthetic_documents
      path: "@synthetic"
      weight: 1.0

sequence_teacher:
  enabled: true
  model: dummy-echo
  predictions: null
  device: cpu
  dtype: float32
  max_new_tokens: 16
  temperature: 0.0
  min_score: 0.8
  min_acceptance_rate: 0.0
  target_probability: 0.5
  target_format: answer
  seed: 7

tokenizer:
  vocab_size: 512
  min_frequency: 1
  no_progress: true

initialization:
  arm: I0_random
  seed: 5
  device: cpu
  allow_full_memory: false
  tiny: true

pretraining:
  max_steps: 1
  batch_size: 1
  num_workers: 0
  eval_group_by: component
  no_grounding: false

posttraining:
  sft:
    max_steps: 1
    num_workers: 0
    target_mode: evidence_linked
  rlvr:
    max_steps: 1
    replay_every_steps: 1
    replay_loss_coefficient: 0.10
    replay_samples: null

evaluation:
  max_new_tokens: 8
  max_samples: 1
  precision: float32
  seed: 31
  wandb_project: null
  wandb_tags: [native-student, smoke]
  baseline_evaluation: null
  monolingual_control_evaluation: null
